html,body{height:100%;margin:0}
body{background:var(--bg);display:flex;align-items:center;justify-content:center;font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;color:var(--ink)}

.fade{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .3s}
.fade.on{opacity:.85}
.chip{position:absolute;z-index:2;left:50%;bottom:14px;transform:translateX(-50%);background:var(--chip);color:var(--ink);padding:6px 14px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap;pointer-events:none}
.clock{position:absolute;z-index:2;right:18px;top:14px;color:#fff;font-weight:800;font-size:15px;text-shadow:0 1px 3px rgba(40,60,80,.6);pointer-events:none}
.dots{position:absolute;z-index:2;left:18px;top:18px;display:flex;gap:6px}
.dots b{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.5);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:all .25s}
.dots b.on{background:#fff;width:20px;border-radius:4px}
.heart{position:absolute;z-index:2;font-size:22px;pointer-events:none;animation:heart 1.5s ease-out forwards}
@keyframes heart{0%{opacity:1;transform:translateY(0) scale(.6)}100%{opacity:0;transform:translateY(-110px) scale(1.3)}}
</style>
</head>
